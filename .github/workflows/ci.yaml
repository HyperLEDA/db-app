name: "[python] CI"

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install deps
        run: make install-dev

      - name: Run checks
        run: make check

      - name: Run tests
        run: |
          make test-all

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker runtime
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: local/app:latest

      - name: Run image help
        run: |
          docker run --rm --entrypoint "app" local/app:latest --help
          docker run --rm --entrypoint "adminapi" local/app:latest --help
          docker run --rm --entrypoint "dataapi" local/app:latest --help
          docker run --rm --entrypoint "tasks" local/app:latest --help

      - name: Save image
        run: docker save local/app:latest -o image.tar

      - name: Upload image
        uses: actions/upload-artifact@v7
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install deps
        run: make install-dev

      - name: Start environment
        run: docker compose up -d

      - name: Start AdminAPI server
        run: make adminapi &

      - name: Start DataAPI server
        env:
          STORAGE_PASSWORD: password
        run: SERVER_PORT=8081 make dataapi &

      - name: Run regression tests
        run: make test-regression

  release:
    runs-on: ubuntu-latest
    needs: [tests, build, regression]
    if: github.ref_name == github.event.repository.default_branch
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download image
        uses: actions/download-artifact@v8
        with:
          name: docker-image

      - name: Set up Docker runtime
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load image
        run: docker load -i image.tar

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Push image
        run: |
          
          docker tag local/app:latest ${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}
          docker tag local/app:latest ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}
          docker push ${{ env.IMAGE_NAME }}:latest

      - name: Dispatch adminapi release event
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.DEPLOYMENT_GITHUB_TOKEN }}
          repository: hyperleda/deployment
          event-type: adminapi-release

      - name: Dispatch dataapi release event
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.DEPLOYMENT_GITHUB_TOKEN }}
          repository: hyperleda/deployment
          event-type: dataapi-release

      - name: Dispatch tasks release event
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.DEPLOYMENT_GITHUB_TOKEN }}
          repository: hyperleda/deployment
          event-type: tasks-release

