name: "[python] CI"

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install deps
        run: make install-dev

      - name: Run checks
        run: make check

      - name: Run tests
        run: |
          make test-all

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [adminapi, dataapi, fieldapi, tasks]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker runtime
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            SERVICE=${{ matrix.service }}
          load: true
          push: false
          tags: local/${{ matrix.service }}:latest

      - name: Run image help
        run: docker run --rm local/${{ matrix.service }}:latest --help

      - name: Save image
        run: docker save local/${{ matrix.service }}:latest -o image.tar

      - name: Upload image
        uses: actions/upload-artifact@v7
        with:
          name: docker-image-${{ matrix.service }}
          path: image.tar
          retention-days: 1

  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install deps
        run: make install-dev

      - name: Start environment
        run: docker compose up -d

      - name: Start AdminAPI server
        run: make adminapi &

      - name: Start DataAPI server
        env:
          STORAGE_PASSWORD: password
        run: SERVER_PORT=8081 make dataapi &

      - name: Run regression tests
        run: make test-regression

  release-adminapi:
    needs: [tests, build, regression]
    if: github.ref_name == github.event.repository.default_branch
    permissions:
      contents: read
      packages: write
      actions: read
    uses: ./.github/workflows/release-service.yaml
    with:
      service: adminapi
      deployment_event: adminapi-release
      workflow_run_id: ${{ github.run_id }}
      head_sha: ${{ github.sha }}
    secrets: inherit

  release-dataapi:
    needs: [tests, build, regression]
    if: github.ref_name == github.event.repository.default_branch
    permissions:
      contents: read
      packages: write
      actions: read
    uses: ./.github/workflows/release-service.yaml
    with:
      service: dataapi
      deployment_event: dataapi-release
      workflow_run_id: ${{ github.run_id }}
      head_sha: ${{ github.sha }}
    secrets: inherit

  release-fieldapi:
    needs: [tests, build, regression]
    if: github.ref_name == github.event.repository.default_branch
    permissions:
      contents: read
      packages: write
      actions: read
    uses: ./.github/workflows/release-service.yaml
    with:
      service: fieldapi
      deployment_event: fieldapi-release
      workflow_run_id: ${{ github.run_id }}
      head_sha: ${{ github.sha }}
    secrets: inherit

  release-tasks:
    needs: [tests, build, regression]
    if: github.ref_name == github.event.repository.default_branch
    permissions:
      contents: read
      packages: write
      actions: read
    uses: ./.github/workflows/release-service.yaml
    with:
      service: tasks
      deployment_event: tasks-release
      workflow_run_id: ${{ github.run_id }}
      head_sha: ${{ github.sha }}
    secrets: inherit
