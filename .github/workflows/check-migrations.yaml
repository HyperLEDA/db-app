name: Check migrations

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
    
jobs:
  check-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install deps
        run: uv sync

      - name: Check migration file names
        run: make check-migrations

      - name: Start database
        run: docker compose up -d --wait hyperledadb

      - name: Apply migrations
        env:
          STORAGE_ENDPOINT: localhost
          STORAGE_PORT: "6432"
          STORAGE_DBNAME: hyperleda
          STORAGE_USER: hyperleda
          STORAGE_PASSWORD: password
        run: uv run migrate

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Lint database schema
        env:
          PGHOST: localhost
          PGPORT: 6432
          PGUSER: hyperleda
          PGPASSWORD: password
          PGDATABASE: hyperleda
        run: bunx schemalint@2.3.2
